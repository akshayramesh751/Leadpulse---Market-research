[project]
name = "lead-enrichment-agent"
version = "0.1.0"
description = "Autonomous Lead Enrichment Agent for extracting structured B2B company intelligence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.49.0",
    "trafilatura>=1.12.0",
    "readability-lxml>=0.8.1",
    "markdownify>=0.14.0",
    "instructor>=1.7.0",
    "groq>=0.13.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.1",
    "rich>=13.9.0",
    "pandas>=2.2.0",
    "tiktoken>=0.8.0",
    "streamlit>=1.40.0",
    "pillow>=10.0.0",
    "dnspython>=2.8.0",
    "plotly>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
